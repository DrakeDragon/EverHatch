 // v43 roster QA: metadata geometry for all 150 variants plus live DOM state.
 // This is NOT a screenshot test and does not claim every image was decoded.
 function qaRoster(){
   const rigs=window.EVERHATCH_RIG_MANIFEST?.models||{};
   const faces=window.EVERHATCH_FACE33_MANIFEST?.models||{};
   const keys=Object.keys(familyBone);
   const issues=[],bySpecies={};
   const validPoint=p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite)&&p[0]>=0&&p[0]<=W&&p[1]>=0&&p[1]<=H;
   const validRect=a=>Array.isArray(a)&&a.length===4&&a.every(Number.isFinite)&&
     a[0]>=0&&a[1]>=0&&a[0]<a[2]&&a[1]<a[3]&&a[2]<=W&&a[3]<=H;
   for(const sp of keys){
     let rigOk=0,faceOk=0,stageZero=0;
     for(let st=0;st<5;st++)for(let coat=0;coat<6;coat++){
       const id=sp+'-'+st+'-'+coat,r=rigs[id],f=faces[id];
       const rg=!!r&&validRect(r.bbox)&&['head','wing','tail'].every(part=>validPoint(r.pivot?.[part]));
       const fg=!!f&&['eyeRect','jawRect','crestRect'].every(part=>validRect(f[part]))&&
         validPoint(f.jawPivot)&&validPoint(f.crestPivot);
       if(rg)rigOk++;else issues.push(id+':rig-geometry');
       if(fg)faceOk++;else issues.push(id+':face-geometry');
       if(st===0)stageZero++;
     }
     bySpecies[sp]={rig:rigOk,facial:faceOk,expected:30,newborn:stageZero,habits:personalities[sp]?.habits.length||0};
     if(!personalities[sp]||personalities[sp].habits.length!==3)issues.push(sp+':personality');
   }
   const rigCount=wrap.querySelectorAll('.eh-v44-rig').length;
   const faceCount=wrap.querySelectorAll('.eh-v44-face').length;
   const proceduralJoints=!!body?.classList?.contains('eh-procedural-body');
   const rendering=classicMotion?'classic':
     rigCount?'illustrated separate joints':
     proceduralJoints?'equipped SVG separate joints':
     wrap.querySelector('.newborn-frame')?'newborn expression artwork':
     boneCounters.loading?'preparing separate joints':'original-art safety fallback';
   const sources=wrap.querySelectorAll('.growth-frame,.newborn-frame');
   if(rigCount>1)issues.push('duplicate-live-rigs');
   if(faceCount>1)issues.push('duplicate-face-rigs');
   if(rigCount===1&&bone?.image?.style.opacity!=='0')issues.push('source-visibility');
   if(faceCount&&rigCount!==1)issues.push('detached-facial-layer');
   if(faceCount&&!bone?.face?.root?.isConnected)issues.push('facial-parent');
   if(metrics.activeRafs>1)issues.push('multiple-director-loops');
   return {
     version:'v43',scope:'catalog-geometry-and-current-DOM',
     checked:keys.length*30,
     validRig:Object.values(bySpecies).reduce((a,v)=>a+v.rig,0),
     validFace:Object.values(bySpecies).reduce((a,v)=>a+v.facial,0),
     bySpecies,
     live:{species:SPEC?.id||null,stage:S?.phase==='alive'?stage():null,
       coat:S?.coat??null,rigCount,faceCount,creatureImages:sources.length,
       loading:boneCounters.loading,articulated:boneCounters.visible||proceduralJoints,
       rendering,proceduralJoints,
       reducedMotion:reduce.matches,activeRafs:metrics.activeRafs,
       rigFailures:boneCounters.failures,facialFailures:faceStats.failed,
       fallbackActive:boneCounters.disabled,posture:personalityStats.current},
     issues:issues.slice(0,35),passed:issues.length===0,
     limits:'Runtime geometry audit only; all art variants and visual motion require on-device observation'
   };
 }

   qbtn.onclick=()=>{

       '\nRig geometry '+q.validRig+'/'+q.checked+
       ' · Facial geometry '+q.validFace+'/'+q.checked+
       '\n'+Object.entries(q.bySpecies).map(([name,x])=>name+': '+x.rig+'/30').join(' | ')+
       '\nLive: '+(d.species||'none')+' / stage '+(d.stage??'-')+' / coat '+(d.coat??'-')+
       '\nRendering: '+d.rendering+
       '\nRigs '+d.rigCount+' · faces '+d.faceCount+' · failures '+(d.rigFailures+d.facialFailures)+
       '\n'+(q.issues.length?q.issues.join(', '):'No geometry/DOM warnings')+
       '\nVisual quality requires device testing.';
   };
   lab.appendChild(qbtn);lab.appendChild(qpanel);
   lab.style.flexWrap='wrap';lab.style.width='min(420px,calc(100vw - 12px))';
   lab.querySelectorAll('button').forEach(b=>{b.style.flex='1 1 22%';b.style.minWidth='58px';});
   document.body.appendChild(lab);
 }
